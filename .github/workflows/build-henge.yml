name: Build Henge 0.2 diagnostic (experimental)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: henge-diagnostic-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      HUSK: ${{ github.workspace }}/Husk
      IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
    - name: Check out exact upstream 0.2 source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Leviidev/Henge
        ref: f9c12c93620af4c4c5f5f65f9793b72f883be682
        path: Henge
        persist-credentials: false
    - name: Check out pinned Husk dependency source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Leviidev/Husk
        ref: afe83d45b31194c4cc9f7b3db7ec2c757db8346e
        path: Husk
        persist-credentials: false
    - name: Apply narrow diagnostics (no engine or RAM behavior changes)
      shell: bash
      run: |
        python3 - <<'PYDIAG'
        import os, plistlib
        from pathlib import Path
        root=Path('Henge')
        p=root/'ios/Henge/Installer.swift'
        s=p.read_text()
        s=s.replace('        machineName = name\n', '        machineName = name\n        RestoreDiagnostics.begin(releaseID: release.id, selectedMB: ramMB)\n', 1)
        s=s.replace('            defer { UIApplication.shared.isIdleTimerDisabled = false }', '            defer { UIApplication.shared.isIdleTimerDisabled = false; RestoreDiagnostics.finish() }', 1)
        s=s.replace('        let ram = GuestMemory.prepare(restoring)', '        let ram = GuestMemory.prepare(restoring)\n        RestoreDiagnostics.record("restore-allocation actualMB=\\(ram) minimumMB=2048")', 1)
        s=s.replace('        while true {\n            try await Task.sleep(nanoseconds: 1_000_000_000)', '        var diagnosticTick = 0\n        while true {\n            try await Task.sleep(nanoseconds: 1_000_000_000)\n            diagnosticTick += 1\n            if diagnosticTick % 5 == 0 { RestoreDiagnostics.snapshot(step: step, progress: stepProgress) }', 1)
        s=s.replace('                phase = .failed(error.localizedDescription)', '                RestoreDiagnostics.record("install-failed; inspect private henge.log for detail")\n                phase = .failed(error.localizedDescription)', 1)
        assert 'RestoreDiagnostics.snapshot' in s
        p.write_text(s)
        (root/'ios/Henge/RestoreDiagnostics.swift').write_text(r'''// Experimental diagnostics, 2026-11-10. GPL-2.0-or-later, as Henge.
        // Stays on the phone. No network upload, IPs, pairing data, paths or machine names.
        import Foundation
        import UIKit

        @MainActor
        enum RestoreDiagnostics {
            private static var handle: FileHandle?
            private static var warning: NSObjectProtocol?
            private static var priorTunnel: Bool?
            private static let clock = ISO8601DateFormatter()

            static func begin(releaseID: String, selectedMB: Int) {
                finish()
                let fm = FileManager.default
                guard let documents = fm.urls(for: .documentDirectory, in: .userDomainMask).first else { return }
                let dir = documents.appendingPathComponent("RestoreDiagnostics", isDirectory: true)
                do {
                    try fm.createDirectory(at: dir, withIntermediateDirectories: true)
                    let existing = (try? fm.contentsOfDirectory(at: dir, includingPropertiesForKeys: nil)) ?? []
                    let logs = existing.filter { $0.lastPathComponent.hasPrefix("restore-") && $0.pathExtension == "txt" }.sorted { $0.lastPathComponent < $1.lastPathComponent }
                    // Retain three install attempts. Reopening Henge does not rotate them.
                    for old in logs.prefix(max(0, logs.count - 2)) { try? fm.removeItem(at: old) }
                    let filename = "restore-\(Int(Date().timeIntervalSince1970)).txt"
                    let file = dir.appendingPathComponent(filename)
                    guard fm.createFile(atPath: file.path, contents: nil, attributes: [.protectionKey: FileProtectionType.completeUntilFirstUserAuthentication]) else { return }
                    handle = try FileHandle(forWritingTo: file)
                    warning = NotificationCenter.default.addObserver(forName: UIApplication.didReceiveMemoryWarningNotification, object: nil, queue: .main) { _ in
                        Task { @MainActor in record("iOS-memory-warning") }
                    }
                    priorTunnel = nil
                    record("experimental=0.2.1-diag.1 base=0.2 releaseID=\(releaseID) selectedMB=\(selectedMB) physicalMB=\(ProcessInfo.processInfo.physicalMemory >> 20)")
                    record("No crash fix claimed. No automatic upload. Restore minimum is 2048 MB even when 1024 MB is selected.")
                } catch { HengeLog.log("diagnostic", "could not create private restore diagnostic file") }
            }

            static func record(_ message: String) {
                guard let handle else { return }
                let line = "\(clock.string(from: Date())) \(message)\n"
                if let data = line.data(using: .utf8) {
                    try? handle.write(contentsOf: data)
                    try? handle.synchronize()
                }
            }

            static func snapshot(step: Int, progress: Double) {
                let tunnel = LocalDevVPN.isConnected
                let state: String
                switch UIApplication.shared.applicationState {
                case .active: state = "active"
                case .inactive: state = "inactive"
                default: state = "background"
                }
                // Existing helper records Henge's charged footprint and available-before-jetsam.
                // This is not total system free memory and not proof of a memory kill.
                HengeLog.logFootprint("restore-diagnostic")
                let available = henge_available_memory() >> 20
                record("step=\(step) percent=\(Int(progress * 100)) appState=\(state) tunnelDetected=\(tunnel) availableForAppMB=\(available) thermalRaw=\(ProcessInfo.processInfo.thermalState.rawValue)")
                if priorTunnel != tunnel { record("tunnel-observation-changed; interface heuristic only, not VPN stop reason") }
                priorTunnel = tunnel
            }

            static func finish() {
                if handle != nil { record("diagnostic-session-ended-normally") }
                if let warning { NotificationCenter.default.removeObserver(warning) }
                warning = nil
                try? handle?.close()
                handle = nil
            }
        }
        ''')
        p=root/'ios/Henge/Info.plist'
        d=plistlib.loads(p.read_bytes()); d['CFBundleShortVersionString']='0.2.1'; d['CFBundleVersion']='101'; d['HengeDiagnosticVersion']='0.2.1-diag.1'; p.write_bytes(plistlib.dumps(d, sort_keys=False))
        # Keep the bundle identifier, document paths, entitlements and JIT behavior unchanged.

        PYDIAG
        git -C Henge diff --check
    - name: Install build tools and target
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for tool in meson ninja pkg-config xcodegen cmake; do
          command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
        done
        if ((${#missing[@]})); then brew install "${missing[@]}"; fi
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup target add aarch64-apple-ios
        xcodebuild -version
    - name: Build pinned dependencies
      working-directory: Husk
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        bash scripts/fetch_sources.sh
        bash scripts/build_ios.sh libffi glib libslirp
        bash scripts/build_rppairing_ios.sh
    - name: Build JIT framework from pinned source and package experimental IPA
      working-directory: Henge
      shell: bash
      run: |
        set -euo pipefail
        zsh ios/scripts/fetch_deps.sh
        bash ci/build-stikjit.sh "$GITHUB_WORKSPACE/StikJIT"
        rm -rf ios/deps/StikJIT.xcframework
        ditto "$GITHUB_WORKSPACE/StikJIT/StikJIT.xcframework" ios/deps/StikJIT.xcframework
        zsh tools/build_ios_restore.sh
        make ios-lib
        mkdir -p "$HOME/Desktop"
        zsh ios/scripts/package_ipa.sh
    - name: Validate package, identity, diagnostics and privacy boundaries
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYVERIFY'
        from pathlib import Path
        import plistlib,zipfile,hashlib
        p=Path.home()/'Desktop/Henge.ipa'
        with zipfile.ZipFile(p) as z:
            names=z.namelist()
            for n in names:
                assert not any(x in n.lower() for x in ('pairingfile','henge.log','henge-prev.log','disk.img','avpbooter','avpsepbooter','.mobileprovision')),n
            d=plistlib.loads(z.read('Payload/Henge.app/Info.plist'))
            assert d['CFBundleIdentifier']=='com.henge.app',d
            assert d['CFBundleShortVersionString']=='0.2.1',d
            assert d['CFBundleVersion']=='101',d
            assert d['HengeDiagnosticVersion']=='0.2.1-diag.1',d
            for n in ['Payload/Henge.app/Henge','Payload/Henge.app/PlugIns/HengeJITHelper.appex/HengeJITHelper','Payload/Henge.app/Frameworks/StikJIT.framework/StikJIT']:
                assert n in names,n
            binary=z.read('Payload/Henge.app/Henge')
            assert b'restore-diagnostic' in binary
            assert b'tunnel-observation-changed' in binary
        print('Experimental IPA validated:',p.stat().st_size,'bytes SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
        PYVERIFY
        mkdir -p /tmp/henge-ipa-inspection
        unzip -q "$HOME/Desktop/Henge.ipa" -d /tmp/henge-ipa-inspection
        APP=/tmp/henge-ipa-inspection/Payload/Henge.app
        codesign --verify --deep --strict "$APP"
        codesign -d --entitlements - --xml "$APP" > /tmp/henge-entitlements.plist 2>/dev/null
        /usr/libexec/PlistBuddy -c 'Print :get-task-allow' /tmp/henge-entitlements.plist | grep true
        printf '%s\n' 'Compiled experimental package validated. Physical device behavior unverified.' >> "$GITHUB_STEP_SUMMARY"
    - name: Archive and check corresponding source and licenses
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p release/Source/Henge release/Source/Husk release/Source/StikJIT release/Source/build-recipe
        # Archive only reviewed source inputs, not build folders, credentials, diagnostic logs or system images.
        git -C Henge archive HEAD | tar -x -C release/Source/Henge
        cp Henge/ios/Henge/Installer.swift Henge/ios/Henge/RestoreDiagnostics.swift Henge/ios/Henge/Info.plist release/Source/Henge/ios/Henge/
        git -C Husk archive HEAD | tar -x -C release/Source/Husk
        git -C StikJIT archive HEAD | tar -x -C release/Source/StikJIT
        cp StikJIT/Sources/ScriptRunner.swift release/Source/StikJIT/Sources/
        mkdir -p release/Source/Husk/third_party/sources
        cp Husk/third_party/sources/* release/Source/Husk/third_party/sources/
        # Supply the exact Rust dependency sources covered by Cargo.lock.
        (cd Husk/src/rppairing-ios && cargo vendor --locked "$GITHUB_WORKSPACE/release/Source/rust-vendor")
        # Source archives plus original dependency tarballs retain all dependency license notices.
        mkdir -p release/Source/Husk/third_party/build/libucontext
        git -C Husk/third_party/build/libucontext archive HEAD | tar -x -C release/Source/Husk/third_party/build/libucontext
        cp Husk/src/app/Husk/Resources/legal/LICENSES-rppairing-crates.txt release/Source/Henge/ios/Henge/Resources/legal/
        # Record public workflow and exact source inputs as the reproducible build recipe.
        gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build-henge.yml?ref=$GITHUB_SHA" --jq .content | base64 --decode > release/Source/build-recipe/build-henge.yml
        cat > release/Source/BUILDING.txt <<'EOF'
        Experimental Henge 0.2.1-diag.1, build 101
        Not a verified crash fix. Device behavior not tested by this build.
        Henge base: f9c12c93620af4c4c5f5f65f9793b72f883be682 (upstream 0.2)
        Husk source: afe83d45b31194c4cc9f7b3db7ec2c757db8346e
        StikJIT 1.9.0: 32287268fa5824f9edce4cb359f5833ce0cf7b00, with Henge ci/stikjit-high-address.patch
        The modified Henge files are already applied in Source/Henge. Full build steps are in build-recipe/build-henge.yml.
        Requires macOS with Xcode27, xcodegen, cmake, meson, ninja, pkg-config, Rust aarch64-apple-ios.
        Set HUSK to the Husk folder; IOS_DEPS to Husk/build/ios-arm64/sysroot.
        Build Husk scripts/fetch_sources.sh, scripts/build_ios.sh libffi glib libslirp, scripts/build_rppairing_ios.sh.
        Run Henge ios/scripts/fetch_deps.sh; rebuild StikJIT using ci/build-stikjit.sh; copy framework to ios/deps; run tools/build_ios_restore.sh, make ios-lib, ios/scripts/package_ipa.sh.
        All original copyright and license notices are preserved. Henge is GPL-2.0-or-later; combined distribution may be GPL-3.0 due to idevicerestore. StikJIT is MPL-2.0; bundled idevice FFI is MIT, preserved as supplied upstream. Rust crate sources and original dependency archives are included. See Henge/docs/licensing.md and bundled notices.
        No Apple macOS restore images, boot ROM, exported Macs, private logs, pairing files or credentials are included.
        App bundle identity remains com.henge.app; side-loading requires re-signing with a suitable certificate. Do not delete a current installation/data to install this build. Back up existing Mac exports outside the app first. Same signing identity/bundle identifier is needed for an in-place update.
        Diagnostic traces stay on device at Documents/RestoreDiagnostics; up to three install attempts are retained. No automatic upload. Normal upstream Henge logs can contain device/path data; keep them private.
        EOF
        cp "$HOME/Desktop/Henge.ipa" release/Henge-0.2.1-diag.1-unsigned.ipa
        python3 - <<'PYVALIDATE'
        from pathlib import Path
        root=Path('release/Source')
        for p in root.rglob('*'):
            if p.is_file():
                n=p.name.lower()
                assert not n.endswith(('.ipsw','.mobiledevicepairing','.mobileprovision')),p
                assert n not in ('henge.log','henge-prev.log','henge-native.log','henge-native-prev.log','disk.img','auxiliary.bin','avpbooter.vmapple2.bin'),p
        for req in ('Henge/LICENSE','Henge/ios/Henge/RestoreDiagnostics.swift','Husk/src/rppairing-ios/Cargo.lock','StikJIT/LICENSE','BUILDING.txt','build-recipe/build-henge.yml'):
            assert (root/req).is_file(),req
        assert (root/'rust-vendor').is_dir()
        PYVALIDATE
        tar -czf release/Henge-0.2.1-diag.1-corresponding-source.tar.gz -C release Source
        (cd release && shasum -a 256 Henge-*.ipa Henge-*.tar.gz > SHA256SUMS.txt)
        python3 - <<'PYSIZE'
        from pathlib import Path
        for p in Path('release').glob('*'):
            if p.is_file():
                assert p.stat().st_size < 2*1024**3,p
                print(p.name,p.stat().st_size)
        PYSIZE
    - name: Publish validated experimental prerelease (no Actions artifacts)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cat > /tmp/henge-release-notes.txt <<'EOF'
        Experimental diagnostic build, NOT a verified crash fix. Based only on upstream 0.2 plus narrow install tracing; no new emulator engine or RAM behavior changes. Physical-device testing remains required.

        Adds persistent local restore-attempt traces with timestamps, stage, actual restore RAM, memory warnings and tunnel-interface observations. Keeps three attempts across app restarts. No automatic uploads; no personal logs or pairing data included in this release.

        The IPA is ad-hoc signed and must be re-signed by a suitable sideloader. Bundle identity is preserved. Do not delete your current app or its data to install it; use a compatible in-place update only after backing up any Mac exports outside the app. No macOS restore images or Apple boot ROM included.

        Corresponding modified source, dependency source archives, build recipe and copyright/license notices are provided in the source asset. See BUILDING.txt. SHA256 checksums are included.
        EOF
        gh release create v0.2.1-diag.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Henge 0.2.1-diag.1 - experimental diagnostics' --notes-file /tmp/henge-release-notes.txt release/Henge-0.2.1-diag.1-unsigned.ipa release/Henge-0.2.1-diag.1-corresponding-source.tar.gz release/SHA256SUMS.txt
    - name: Print limited build errors if compilation failed
      if: failure()
      shell: bash
      run: |
        for f in Henge/ios/build/DerivedData.buildlog Husk/build/logs/*.log; do
          if [ -f "$f" ]; then echo "=== $f ==="; tail -60 "$f"; fi
        done
    permissions:
      contents: write
